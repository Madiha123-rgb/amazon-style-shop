<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo-nav">ShopHub</div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products...">
                <button>Search</button>
            </div>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#categories">Categories</a>
                <a href="#deals">Deals</a>
                <a href="#account">Account</a>
            </div>
            <div class="cart-icon">
                <a href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a>
            </div>
        </div>
    </nav>

    <div class="banner">
        <div class="banner-content">
            <h2>Welcome to ShopHub</h2>
            <p>Discover amazing products at unbeatable prices</p>
        </div>
    </div>

    <div class="categories-section">
        <h3>Shop by Category</h3>
        <div class="categories">
            <div class="category-card">Electronics</div>
            <div class="category-card">Fashion</div>
            <div class="category-card">Home & Garden</div>
            <div class="category-card">Sports</div>
        </div>
    </div>

    <div class="products-section">
        <h3>Featured Products</h3>
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 ShopHub. All rights reserved.</p>
    </footer>

    <script src="home.js"></script>
</body>
</html>
